[workspace]
resolver = "2"
members = [
    "crates/skarn-core",
    "crates/skarn-fs",
    "crates/skarn-editor",
    "crates/skarn-lsp",
    "crates/skarn-git",
    "crates/skarn-ai",
    "crates/skarn-settings",
    "crates/skarn-tokens",
    "crates/skarn-ui",
    "crates/skarn-app",
    "crates/skarn-protocol",
    "crates/skarn-workflow",
    "apps/skarn-desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/codeREDxbt/Skarn"
homepage = "https://github.com/codeREDxbt/Skarn"

[workspace.dependencies]
egui = "0.36"
eframe = "0.36"
# Buffer rope + shared types (skarn-core).
ropey = "1.6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
skarn-protocol = { path = "crates/skarn-protocol" }
# Networking (skarn-ai): reqwest with rustls only — no OpenSSL on Windows (PLAN.md §4.7).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# Installer download verification (skarn-ai::updates): the published
# `Skarn-Setup-<version>.exe.sha256` is checked before the updater
# hands the file to the OS. A pure-Rust digest keeps the Windows build
# free of native crypto dependencies.
sha2 = "0.10"
# LSP client types (skarn-lsp): PLAN.md §4.5 — thin client, no tower-lsp.
lsp-types = "0.97"
# Git bindings (skarn-git): PLAN.md §4.6 — vendored libgit2 so Windows
# builds don't need a system libgit2.
git2 = { version = "0.21", features = ["vendored-libgit2"] }
# OS keyring (skarn-settings): the API key's only home (PLAN.md §4.8 —
# never a file). Windows Credential Manager behind the platform-agnostic API.
keyring = "3"
# Dev-only: mock gateway for skarn-ai tests (ROADMAP.md Phase 1b).
wiremock = "0.6"
# Embedded terminal (desktop shell): Windows ConPTY through the same crate
# WezTerm uses, so the pty semantics (resize, EOF, exit code) are the
# battle-tested ones rather than a hand-rolled CreatePseudoConsole wrapper.
portable-pty = "0.9"

skarn-core = { path = "crates/skarn-core" }
skarn-fs = { path = "crates/skarn-fs" }
skarn-editor = { path = "crates/skarn-editor" }
skarn-lsp = { path = "crates/skarn-lsp" }
skarn-git = { path = "crates/skarn-git" }
skarn-ai = { path = "crates/skarn-ai" }
skarn-settings = { path = "crates/skarn-settings" }
skarn-tokens = { path = "crates/skarn-tokens" }
skarn-ui = { path = "crates/skarn-ui" }
skarn-app = { path = "crates/skarn-app" }
skarn-workflow = { path = "crates/skarn-workflow" }

# Release profile per ARCHITECTURE.md §14.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
